<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Childhood Games</title>
<style>
  :root { --muted:#a9bbd3; }
  html, body { margin:0; height:100%; background:#000; color:#f3f6fb;
               font:14px/1.4 -apple-system, system-ui, sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; box-sizing:border-box; }
  #topp { display:flex; gap:16px; align-items:center; padding:6px 8px; color:var(--muted); min-height:20px; }
  #topp a { color:var(--muted); text-decoration:none; }
  #topp a:hover { color:#fff; }
  #rubrik { white-space:pre; }
  #fps { font-variant-numeric: tabular-nums; display:none; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; background:#000; outline:none; }
  #fel { color:#ff8a8a; white-space:pre-wrap; padding:16px; max-width:800px; }
  #ruta { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.35); }
  #ruta div { background:#d4d0c8; color:#000; min-width:260px; max-width:420px; border:2px solid #fff;
              box-shadow: 2px 2px 0 #404040; font:13px Tahoma, Verdana, sans-serif; }
  #ruta h3 { margin:0; padding:3px 6px; font-size:13px; color:#fff; background:linear-gradient(90deg,#0a246a,#a6caf0); }
  #ruta p { margin:18px 16px; white-space:pre-wrap; }
  #ruta button { display:block; margin:0 auto 14px; min-width:80px; font:13px Tahoma, Verdana, sans-serif; }
  #laddar { color:var(--muted); }
  /* Pekknappar: visas bara på pekskärmar (se pekknappar() nedan). Ligger över spelet i hörnen. */
  #pek { display:none; position:fixed; left:0; right:0; bottom:0; justify-content:space-between; align-items:flex-end;
         padding:12px max(12px, env(safe-area-inset-left, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-right, 0px));
         pointer-events:none; -webkit-user-select:none; user-select:none; }
  #pek .grupp, #pek .kol { display:flex; gap:10px; align-items:flex-end; pointer-events:none; }
  #pek .kol { flex-direction:column; align-items:center; }
  #pek button { pointer-events:auto; touch-action:none; width:60px; height:60px; border-radius:50%;
                border:2px solid rgba(255,255,255,.55); background:rgba(20,30,50,.45); color:#fff;
                font:700 22px/1 -apple-system, system-ui, sans-serif; -webkit-tap-highlight-color:transparent; }
  #pek button.liten { width:48px; height:48px; font-size:14px; }
  #pek button.nere { background:rgba(255,211,77,.55); }
  #pek.aktiv { display:flex; }
  body.pekskarm { overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
</style>
</head>
<body>
<div id="topp"><a href="index.html">← All games</a><span id="rubrik"></span><span id="fps"></span></div>
<canvas id="skarm" tabindex="0"></canvas>
<div id="laddar">Loading …</div>
<div id="fel"></div>
<div id="pek" aria-hidden="true">
  <div class="grupp"><button data-k="37" aria-label="Left">◀</button><button data-k="39" aria-label="Right">▶</button></div>
  <div class="grupp"><div class="kol"><button data-k="32" class="liten" aria-label="Fireball">Fire</button><button data-k="40" class="liten" aria-label="Down">▼</button></div><button data-k="38" aria-label="Jump">▲</button></div>
</div>
<div id="ruta"><div><h3 id="rutaRubrik"></h3><p id="rutaText"></p><button id="rutaOk">OK</button></div></div>
<script type="module">
import { startGame } from './motor/main.js';

const q = new URLSearchParams(location.search);
const namn = q.get('spel') || 'tomtenissar';
const canvas = document.getElementById('skarm');
const rubrik = document.getElementById('rubrik');
const fpsEl = document.getElementById('fps');
if (q.get('fps') === '1') fpsEl.style.display = '';

const ruta = document.getElementById('ruta');
let titel = namn;
const ui = {
  chromeHeight: () => document.getElementById('topp').offsetHeight + 8,
  // Plats för pekknapparna: på sidorna i liggande läge, under spelet i stående.
  reserve: () => {
    if (!document.getElementById('pek').classList.contains('aktiv')) { document.body.style.paddingBottom = ''; return { w: 0, h: 0 }; }
    const liggande = innerWidth > innerHeight;
    document.body.style.paddingBottom = liggande ? '' : '150px';
    return liggande ? { w: 280, h: 0 } : { w: 0, h: 150 };
  },
  setCaption: (t) => { t = t.trim(); rubrik.textContent = t; titel = t.trim() || namn; document.title = titel; },
  setFps: (steg, bilder) => { fpsEl.textContent = `${steg} steps/s · ${bilder} frames/s`; },
  showMessage: (text) => new Promise((ok) => {
    document.getElementById('rutaRubrik').textContent = titel.split('  ')[0] || namn;
    document.getElementById('rutaText').textContent = text;
    ruta.style.display = 'flex';
    const knapp = document.getElementById('rutaOk');
    const stang = () => {
      ruta.style.display = 'none';
      removeEventListener('keydown', tangent, true);
      knapp.onclick = null;
      canvas.focus();
      ok();
    };
    const tangent = (e) => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); stang(); } };
    knapp.onclick = stang;
    setTimeout(() => addEventListener('keydown', tangent, true), 150);
    knapp.focus();
  }),
};

// Pekknappar skickar samma tangentkoder som tangentbordet. Bara knappar som spelet använder visas.
function pekknappar(game) {
  const variant = q.get('variant');
  const behovs = new Set([37, 38, 39]);
  if (namn === 'goombas' && variant === 'komplett') { behovs.add(40); behovs.add(32); }
  const pek = document.getElementById('pek');
  for (const b of pek.querySelectorAll('button')) {
    const k = Number(b.dataset.k);
    if (!behovs.has(k)) { b.remove(); continue; }
    const ned = (e) => {
      e.preventDefault();
      try { b.setPointerCapture(e.pointerId); } catch {}
      game.audio.unlock();
      if (game.modal) return;
      if (!game.keys.has(k)) game.pressed.add(k);
      game.keys.add(k);
      game.lastKey = k;
      b.classList.add('nere');
    };
    const upp = (e) => {
      e.preventDefault();
      if (game.keys.delete(k)) game.released.add(k);
      b.classList.remove('nere');
    };
    b.addEventListener('pointerdown', ned);
    b.addEventListener('pointerup', upp);
    b.addEventListener('pointercancel', upp);
    b.addEventListener('lostpointercapture', upp);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  // pekskärm: grov pekare eller ingen hovring (telefoner, surfplattor); ?pek=1 tvingar fram knapparna
  const pekskarm = q.get('pek') === '1' || matchMedia('(pointer: coarse)').matches || matchMedia('(hover: none)').matches;
  if (pekskarm) { pek.classList.add('aktiv'); document.body.classList.add('pekskarm'); dispatchEvent(new Event('resize')); }
}

try {
  const game = await startGame(namn, canvas, ui, q.get('variant'));
  pekknappar(game);
  document.getElementById('laddar').remove();
  canvas.focus();
} catch (e) {
  document.getElementById('laddar').remove();
  document.getElementById('fel').textContent = 'Error: ' + e.message;
  console.error(e);
}
</script>
</body>
</html>
